# baytur.kg — корпоративный сайт группы «Байтур» (Django, /opt/baytur-hub).
# Ставится в /etc/nginx/sites-available/baytur.kg + симлинк в sites-enabled.
#
# Основной адрес — https://baytur.kg. www и http отдают 301 на него.
# Адреса, которых на хабе нет (наследие копии сайта курорта), Django сам
# переадресует на resort.baytur.kg — см. LEGACY_REDIRECT_URL в .env.
#
# Сертификат свой, не общий с курортом: /etc/letsencrypt/live/baytur.kg
# (домены baytur.kg и www.baytur.kg, продление через webroot /var/www/certbot).

upstream baytur_hub {
    server 127.0.0.1:8093;
    keepalive 8;
}

server {
    server_name baytur.kg;
    server_tokens off;

    client_max_body_size 20M;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json text/plain text/markdown application/xml;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location /static/ {
        alias /opt/baytur-hub/app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location /media/ {
        alias /opt/baytur-hub/app/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://baytur_hub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/baytur.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baytur.kg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

# www.baytur.kg → baytur.kg, путь сохраняется
server {
    server_name www.baytur.kg;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://baytur.kg$request_uri; }

    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/letsencrypt/live/baytur.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baytur.kg/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name baytur.kg www.baytur.kg;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://baytur.kg$request_uri; }
}
