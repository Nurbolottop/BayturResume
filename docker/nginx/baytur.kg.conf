# nginx для хаба baytur.kg — кладётся в /etc/nginx/sites-available/baytur.kg
# Основной адрес — https://baytur.kg. www и http отдают 301 на него.
# Сертификат свой, не общий с резортом: certbot --nginx -d baytur.kg -d www.baytur.kg

upstream baytur_hub {
    server 127.0.0.1:8081;
}

server {
    listen 80;
    listen [::]:80;
    server_name baytur.kg www.baytur.kg;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://baytur.kg$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.baytur.kg;

    ssl_certificate     /etc/letsencrypt/live/baytur.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baytur.kg/privkey.pem;

    return 301 https://baytur.kg$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name baytur.kg;

    ssl_certificate     /etc/letsencrypt/live/baytur.kg/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/baytur.kg/privkey.pem;

    client_max_body_size 20M;

    location /static/ {
        alias /opt/baytur-hub/app/staticfiles/;
        expires 30d;
        access_log off;
    }

    location /media/ {
        alias /opt/baytur-hub/app/media/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://baytur_hub;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
