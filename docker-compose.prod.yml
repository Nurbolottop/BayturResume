# Прод. Сервер общий и памяти на нём мало, поэтому стек облегчён:
#   - Redis не поднимается — сайт его не использует;
#   - Postgres с урезанными буферами и лимитом памяти;
#   - gunicorn: один процесс, четыре потока.
services:
  db:
    image: postgres:14
    restart: always
    env_file:
      - .env
    command: postgres -c shared_buffers=32MB -c max_connections=20 -c work_mem=2MB -c maintenance_work_mem=16MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 192m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: always
    command: sh -c "/entrypoint.sh && gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 1 --threads 4 --worker-class gthread --max-requests 1000 --max-requests-jitter 100 --timeout 60 --access-logfile -"
    volumes:
      - ./app:/app
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.prod
    mem_limit: 256m
    depends_on:
      db:
        condition: service_healthy
    ports:
      # наружу только через nginx на хосте
      - "127.0.0.1:${WEB_PORT:-8000}:8000"

volumes:
  postgres_data:
